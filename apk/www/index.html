<!doctype html>
<html lang="es-PE">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cuaderno de Campo</title>
  <style>
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#FFF9F0; color:#3b2f5c;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align:center; padding:24px; box-sizing:border-box; }
    main { max-width:22rem; display:flex; flex-direction:column; align-items:center; gap:16px; }
    h1 { margin:0; font-size:1.5rem; }
    p { margin:0; color:#6d6386; line-height:1.5; }
    button { border:0; border-radius:999px; padding:12px 24px; font-size:1rem; font-weight:700; background:#C2186B; color:#fff; box-shadow:0 3px 0 #7d0d45; }
  </style>
</head>
<body>
  <main>
    <img src="logo.svg" alt="" width="96" height="96" />
    <h1>No se pudo abrir Cuaderno de Campo</h1>
    <p>Revisa tu conexión a internet e inténtalo de nuevo. La primera vez la app necesita internet; después funciona sin conexión.</p>
    <button type="button" onclick="location.href='https://cuaderno-de-campo-inicial.netlify.app/inicio/'">Intentar de nuevo</button>
  </main>
</body>
</html>

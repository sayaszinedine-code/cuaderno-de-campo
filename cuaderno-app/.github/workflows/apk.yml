# Compila el APK en GitHub sin instalar nada en tu computadora:
# sube este proyecto a un repositorio, entra a Actions › "Compilar APK" › Run workflow,
# y descarga el APK desde "Artifacts" al terminar.
name: Compilar APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run build
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: cuaderno-de-campo-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

<title>Cuaderno de Campo Inicial</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
/* Layout: cuaderno de aula — barra lateral en escritorio, pestañas abajo en celular; registros como fichas con sello de fecha */
:root{
  --bg:#F3F6F4; --surface:#FFFFFF; --surface-2:#E8EFEB; --ink:#1E2B3A; --muted:#5B6B78; --line:#D3DDD8;
  --accent:#1F7A6D; --accent-ink:#FFFFFF; --accent-soft:#D6EEEA; --sun:#E8A33D; --sun-soft:#FBEBCF;
  --ok:#2E8B57; --warn:#C27C0E; --bad:#C2453A; --ok-soft:#DCF1E4; --bad-soft:#F7DEDB;
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px; --shadow:0 1px 2px rgba(30,43,58,.06),0 4px 14px rgba(30,43,58,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111A1F; --surface:#18242B; --surface-2:#203038; --ink:#E6EEF0; --muted:#9AAAB3; --line:#2C3D46;
  --accent:#4CC2AE; --accent-ink:#0B1A17; --accent-soft:#1B3B37; --sun:#F0B654; --sun-soft:#3A2E17;
  --ok:#5BC48A; --warn:#E3A64A; --bad:#EE7B6F; --ok-soft:#1D3A2A; --bad-soft:#40211E;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111A1F; --surface:#18242B; --surface-2:#203038; --ink:#E6EEF0; --muted:#9AAAB3; --line:#2C3D46;
  --accent:#4CC2AE; --accent-ink:#0B1A17; --accent-soft:#1B3B37; --sun:#F0B654; --sun-soft:#3A2E17;
  --ok:#5BC48A; --warn:#E3A64A; --bad:#EE7B6F; --ok-soft:#1D3A2A; --bad-soft:#40211E;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:1.75rem;font-weight:700}
h2{font-size:1.3rem;font-weight:600}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100%}
nav.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;padding:20px 12px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.2rem;padding:4px 10px 16px;line-height:1.1}
.brand small{display:block;font-family:var(--f-body);font-weight:600;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.tab{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;border:0;background:none;cursor:pointer;text-align:left;font-weight:600;color:var(--muted)}
.tab svg{width:20px;height:20px;flex:none}
.tab:hover{background:var(--surface-2);color:var(--ink)}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
main{min-width:0;padding-block:24px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer;min-height:40px}
.btn:hover{border-color:var(--accent)}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sun{background:var(--sun-soft);border-color:transparent;color:var(--ink)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:32px;padding:4px 10px;font-size:.85rem}
.btn[disabled]{opacity:.5;cursor:default}
.btn.mic.on{background:var(--bad);border-color:var(--bad);color:#fff}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.85rem;min-width:0}
label.f span.h{font-weight:400;color:var(--muted);font-size:.8rem}
input[type=text],input[type=date],input[type=time],input[type=tel],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;min-height:40px}
textarea{min-height:96px;resize:vertical;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.85rem;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:1px 9px;font-size:.75rem;font-weight:700;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.t-obs{background:var(--accent-soft);color:var(--accent)}
.pill.t-anec{background:var(--sun-soft);color:var(--warn)}
.pill.t-logro{background:var(--ok-soft);color:var(--ok)}
.pill.t-fam{background:var(--surface-2);color:var(--ink)}
.pill.lv{background:var(--ink);color:var(--surface)}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-display);font-size:1.9rem;line-height:1;font-variant-numeric:tabular-nums}
/* ficha de registro */
.entry{display:grid;grid-template-columns:56px 1fr;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;text-align:left;width:100%}
.entry:hover{border-color:var(--accent)}
.stamp{display:flex;flex-direction:column;align-items:center;justify-content:center;border:1.5px dashed var(--accent);border-radius:10px;height:56px;color:var(--accent);font-family:var(--f-display);line-height:1}
.stamp b{font-size:1.4rem}
.stamp span{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.entry .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.entry .txt{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:var(--surface-2)}
.list{display:flex;flex-direction:column;gap:10px}
.kid{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;width:100%;text-align:left}
.kid:hover{border-color:var(--accent)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;flex:none;background:var(--sun-soft);color:var(--warn)}
.kid .grow{flex:1;min-width:0}
.alert{display:flex;gap:10px;align-items:flex-start;background:var(--sun-soft);border-radius:var(--r);padding:12px 14px}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:28px 18px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
/* asistencia */
.att{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line)}
.att:last-child{border-bottom:0}
.att .grow{flex:1;min-width:0;font-weight:600}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 11px;font-weight:700;cursor:pointer;min-width:38px;min-height:36px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"].P{background:var(--ok);color:#fff}
.seg button[aria-pressed="true"].T{background:var(--warn);color:#fff}
.seg button[aria-pressed="true"].F{background:var(--bad);color:#fff}
.seg button[aria-pressed="true"].J{background:var(--muted);color:var(--surface)}
/* agenda */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dn{font-size:.72rem;text-align:center;color:var(--muted);font-weight:700;text-transform:uppercase}
.cal button{aspect-ratio:1/1;max-width:100%;border:1px solid transparent;border-radius:10px;background:var(--surface);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-variant-numeric:tabular-nums;font-weight:600;padding:0}
.cal button.out{opacity:.35}
.cal button.today{border-color:var(--accent);color:var(--accent)}
.cal button.sel{background:var(--accent);color:var(--accent-ink)}
.cal i{width:6px;height:6px;border-radius:50%;background:var(--sun);display:block}
.ev{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev .d{font-family:var(--f-display);font-weight:600;color:var(--accent);line-height:1.1;font-variant-numeric:tabular-nums}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(10,20,25,.45);z-index:40;display:flex;justify-content:center;align-items:flex-end}
.sheet{background:var(--bg);width:min(760px,100%);max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:800px){.sheet-bg{align-items:center}.sheet{border-radius:18px}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:-18px;background:var(--bg);padding-block:6px;z-index:2}
.ai-out{background:var(--surface);border:1px solid var(--accent);border-radius:var(--r);padding:12px 14px;white-space:pre-wrap;min-height:48px}
.ai-out.loading{color:var(--muted);font-style:italic}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.photo{position:relative}
.photo img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:var(--surface-2)}
.photo button{position:absolute;top:4px;right:4px;border:0;border-radius:50%;width:26px;height:26px;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;font-weight:600;max-width:90vw}
.note{font-size:.8rem;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.full-photo{max-width:100%;border-radius:12px}
.timeline{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line);margin-left:6px}
.tl{position:relative;padding:0 0 16px 18px}
.tl::before{content:"";position:absolute;left:-7px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
nav.bottom{display:none}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  nav.side{display:none}
  nav.bottom{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px max(4px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px))}
  nav.bottom .tab{flex-direction:column;gap:2px;font-size:.68rem;padding:6px 2px;justify-content:center;text-align:center}
  .grid2{grid-template-columns:1fr}
  .grid3{grid-template-columns:repeat(3,1fr)}
  h1{font-size:1.5rem}
}
@media (max-width:420px){.stat b{font-size:1.5rem}.entry{grid-template-columns:48px 1fr;gap:10px}.stamp{height:50px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <nav class="side" id="sideNav" aria-label="Secciones"></nav>
  <main><div class="wrap" id="view"><p class="muted">Cargando tu cuaderno…</p></div></main>
  <nav class="bottom" id="bottomNav" aria-label="Secciones"></nav>
</div>
<div id="sheetRoot"></div>
<div id="toastRoot"></div>

<script>
/* ---------- Datos del CNEB (ciclo II, inicial) ---------- */
const AREAS = {
  "Personal Social": ["Construye su identidad","Convive y participa democráticamente en la búsqueda del bien común","Construye su identidad como persona humana, amada por Dios"],
  "Psicomotriz": ["Se desenvuelve de manera autónoma a través de su motricidad"],
  "Comunicación": ["Se comunica oralmente en su lengua materna","Lee diversos tipos de textos escritos en su lengua materna","Escribe diversos tipos de textos en su lengua materna","Crea proyectos desde los lenguajes artísticos"],
  "Castellano como segunda lengua": ["Se comunica oralmente en castellano como segunda lengua"],
  "Matemática": ["Resuelve problemas de cantidad","Resuelve problemas de forma, movimiento y localización"],
  "Ciencia y Tecnología": ["Indaga mediante métodos científicos para construir sus conocimientos"],
  "Competencias transversales": ["Se desenvuelve en entornos virtuales generados por las TIC","Gestiona su aprendizaje de manera autónoma"]
};
const MOMENTOS = ["Recepción y rutinas","Juego libre en sectores","Experiencia de aprendizaje","Taller","Alimentación y recreo","Aseo y descanso","Salida","Fuera del aula / visita"];
const TIPOS = {obs:"Observación", anec:"Anécdota / incidencia", logro:"Logro", fam:"Reunión con familia", otro:"Otro"};
const NIVELES = {AD:"Logro destacado", A:"Logro esperado", B:"En proceso", C:"En inicio"};
const EV_TIPOS = ["Reunión","Entrega de documentos","Actividad con niños","Fecha cívica","Capacitación","Personal"];
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const DIAS = ["dom","lun","mar","mié","jue","vie","sáb"];

/* ---------- Utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uidGen = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const pad = n => String(n).padStart(2,"0");
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hoy = () => isoOf(new Date());
const parseISO = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const fmtCorto = s => { const d = parseISO(s); return `${DIAS[d.getDay()]} ${d.getDate()} ${MESES[d.getMonth()].slice(0,3)}`; };
const fmtLargo = s => { const d = parseISO(s); return `${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]} de ${d.getFullYear()}`; };
const diasEntre = (a,b) => Math.round((parseISO(b)-parseISO(a))/864e5);
const iniciales = n => n.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();
function toast(msg){ const r=$("#toastRoot"); r.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(toast.t); toast.t=setTimeout(()=>r.innerHTML="",2600); }
async function copiar(text, btn){
  try{ await navigator.clipboard.writeText(text); toast("Copiado"); }
  catch{ const out = btn?.closest(".panel,.sheet")?.querySelector(".ai-out"); if(out){ const r=document.createRange(); r.selectNodeContents(out); const s=getSelection(); s.removeAllRanges(); s.addRange(r);} toast("Texto seleccionado: cópialo con Ctrl+C"); }
}
const I = {
  hoy:'<path d="M4 5h16v15H4zM4 9h16M8 3v4M16 3v4"/>',
  cuaderno:'<path d="M6 3h11a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6zM6 3v18M10 8h6M10 12h6"/>',
  ninos:'<circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M15 20c0-2 .8-3.7 2-4.6 2.3.3 4 2.2 4 4.6"/>',
  asis:'<path d="M4 4h16v16H4zM8 12l3 3 5-6"/>',
  agenda:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/>',
  mas:'<path d="M12 4l2.2 4.6 5 .7-3.6 3.5.9 5L12 15.4 7.5 17.8l.9-5L4.8 9.3l5-.7z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
  spark:'<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/>',
  cam:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
  dl:'<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>'
};
const ico = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[k]}</svg>`;

/* ---------- Estado ---------- */
let st = { perfil:{}, ninos:[], agenda:[], registros:{}, asis:{} };
const caps = { db:null, user:null, assets:null, sample:null, dict:null, dl:null, sampleImg:false };
let modo = "local", uid = null, base = null, cargado = false;
const ui = { tab:"hoy", f:{nino:"",area:"",tipo:"",q:""}, nino:null, fechaAsis:hoy(), mes:hoy().slice(0,7), diaSel:hoy() };
let editing = null;

/* ---------- Persistencia: base privada de la docente, o el navegador como respaldo ---------- */
const LKEY = "cuaderno-inicial-v1";
function leerLocal(){ try{ const j = JSON.parse(localStorage.getItem(LKEY)||"null"); if(j) st = Object.assign(st, j); }catch{} }
function guardarLocal(){ try{ localStorage.setItem(LKEY, JSON.stringify(st)); }catch(e){ toast("No se pudo guardar en este navegador (espacio lleno). Exporta un respaldo."); } }
const errGuardar = e => toast(e?.code==="quota_exceeded" ? "Se llenó el espacio de la base. Borra fotos o registros antiguos." : "No se pudo guardar. Revisa tu conexión e inténtalo de nuevo.");
function pathDoc(n){ return caps.db.doc(`data/users/${uid}/${n}`); }
function savePerfil(){ if(modo==="db") pathDoc("perfil").set(st.perfil).catch(errGuardar); else guardarLocal(); }
function saveNinos(){ if(modo==="db") pathDoc("ninos").set({lista:st.ninos}).catch(errGuardar); else guardarLocal(); }
function saveAgenda(){ if(modo==="db") pathDoc("agenda").set({eventos:st.agenda}).catch(errGuardar); else guardarLocal(); }
function saveRegistro(r){ st.registros[r.id]=r; if(modo==="db") base.collection("registros").doc(r.id).set(r).catch(errGuardar); else guardarLocal(); }
function delRegistro(id){ delete st.registros[id]; if(modo==="db") base.collection("registros").doc(id).delete().catch(errGuardar); else guardarLocal(); }
function saveAsis(mes){ if(modo==="db") base.collection("asistencia").doc(mes).set({dias:st.asis[mes]||{}}).catch(errGuardar); else guardarLocal(); }

async function iniciar(){
  render();
  const [db,user,assets,sample,dict,dl] = await Promise.all(["db","user","assets","sample","dictation","downloads"].map(n => window.claude?.use ? claude.use(n).catch(()=>null) : Promise.resolve(null)));
  Object.assign(caps,{db,user,assets,sample,dict,dl});
  if(sample){ try{ caps.sampleImg = !!(await sample.limits())?.images; }catch{} }
  if(dict){
    dict.onPartial(({text}) => { const el = dictTarget && document.getElementById(dictTarget); if(el) el.dataset.partial = text; });
    dict.onFinal(({text}) => { const el = dictTarget && document.getElementById(dictTarget); if(el){ el.value = (el.value.trim()? el.value.trimEnd()+" " : "") + text.trim(); el.dispatchEvent(new Event("input",{bubbles:true})); } });
    dict.onState(({state}) => { dictOn = state==="listening"; document.querySelectorAll(".mic").forEach(b=>b.classList.toggle("on", dictOn && b.dataset.target===dictTarget)); });
  }
  if(db && user){ try{ uid = await user.id(); }catch{} }
  if(db && uid){
    modo = "db"; base = pathDoc("perfil");
    let pend = 5; const listo = () => { if(--pend<=0 && !cargado){ cargado=true; clearTimeout(timer); render(); } };
    const timer = setTimeout(()=>{ if(!cargado){ cargado=true; render(); toast("Aún no llegan tus datos guardados; se mostrarán al conectar."); } }, 10000);
    const onErr = () => { listo(); };
    pathDoc("perfil").onSnapshot(s => { st.perfil = s.exists ? {...s.data()} : {}; listo(); refresco(); }, onErr);
    pathDoc("ninos").onSnapshot(s => { st.ninos = s.exists ? [...(s.data().lista||[])] : []; listo(); refresco(); }, onErr);
    pathDoc("agenda").onSnapshot(s => { st.agenda = s.exists ? [...(s.data().eventos||[])] : []; listo(); refresco(); }, onErr);
    base.collection("registros").onSnapshot(q => { const r={}; q.docs.forEach(d=>r[d.id]={...d.data()}); st.registros=r; listo(); refresco(); }, onErr);
    base.collection("asistencia").onSnapshot(q => { const a={}; q.docs.forEach(d=>a[d.id]=JSON.parse(JSON.stringify(d.data().dias||{}))); st.asis=a; listo(); refresco(); }, onErr);
  } else {
    leerLocal(); cargado = true; render();
  }
}
let refT; function refresco(){ if(!cargado) return; clearTimeout(refT); refT=setTimeout(()=>{ if(!document.querySelector(".sheet")) render(); }, 60); }

/* ---------- Fotos ---------- */
async function comprimir(file, max, q){
  try{
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, max/Math.max(bmp.width,bmp.height));
    const c = document.createElement("canvas"); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r => c.toBlob(r,"image/jpeg",q));
  }catch{ return file; }
}
const blobToDataURL = b => new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=rej; fr.readAsDataURL(b); });
const fotoSrc = f => f.id ? "/_blob/"+f.id : f.src;
async function subirFotos(files){
  const out = [];
  for(const file of files){
    if(caps.assets){
      try{ const b = await comprimir(file,1600,.82); const r = await caps.assets.upload(b,{type:"image/jpeg"}); out.push({id:r.id}); continue; }
      catch(e){ toast("No se pudo subir una foto; se guardará en tamaño reducido."); }
    }
    const b = await comprimir(file, 640, .6);
    out.push({src: await blobToDataURL(b)});
  }
  return out;
}

const CONTEXTO = "Eres asistente pedagógico de una docente de educación inicial en Perú (ciclo II, 3 a 5 años), que trabaja con el Currículo Nacional (CNEB) y la evaluación formativa. Escribe en español peruano claro, respetuoso y profesional.";
async function ia(prompt, outEl, opts={}){
  if(!caps.sample){ outEl.textContent = "El asistente de IA no está disponible en esta vista."; return null; }
  outEl.classList.add("loading"); outEl.textContent = "Redactando…";
  try{
    const r = await caps.sample(CONTEXTO + "\n\n" + prompt, { ...opts, onText:({text}) => { outEl.classList.remove("loading"); outEl.textContent = text; } });
    outEl.classList.remove("loading"); outEl.textContent = r.text; return r.text;
  }catch(e){
    outEl.classList.remove("loading");
    outEl.textContent = e?.code==="not_granted" ? "No diste permiso para usar el asistente. Puedes activarlo desde los permisos del artefacto." : e?.code==="rate_limited" ? "Muchas solicitudes seguidas. Espera un momento e inténtalo otra vez." : "No se pudo generar el texto. Inténtalo de nuevo.";
    return null;
  }
}

/* ---------- Formulario de registro ---------- */
function nuevoReg(ninoId){
  editing = { id:uidGen(), nuevo:true, fecha:hoy(), hora:new Date().toTimeString().slice(0,5), momento:MOMENTOS[1], tipo:"obs", area:"", comp:"", nivel:"", ninos: ninoId?[ninoId]:[], hecho:"", interpretacion:"", acciones:"", fotos:[] };
  abrirSheet();
}
function abrirReg(id){ const r = st.registros[id]; if(!r) return; editing = JSON.parse(JSON.stringify(r)); abrirSheet(); }
function syncForm(){
  if(!editing || !$("#rFecha")) return;
  Object.assign(editing, { fecha:$("#rFecha").value||hoy(), hora:$("#rHora").value, momento:$("#rMom").value, tipo:$("#rTipo").value, area:$("#rArea").value, comp:$("#rComp").value, nivel:$("#rNivel").value, hecho:$("#rHecho").value, interpretacion:$("#rInt").value, acciones:$("#rAcc").value });
}
function abrirSheet(){
  const e = editing, comps = e.area ? AREAS[e.area] : [];
  $("#sheetRoot").innerHTML = `<div class="sheet-bg" data-act="cerrarBg"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shTit">
    <div class="sheet-h"><h2 id="shTit">${e.nuevo?"Nuevo registro":"Registro del "+esc(fmtCorto(e.fecha))}</h2><div class="row"><button class="btn ghost" data-act="cerrar">Cancelar</button><button class="btn primary" data-act="guardarReg">Guardar</button></div></div>

      <label class="f">Momento de la jornada<select id="rMom">${MOMENTOS.map(x=>`<option ${x===e.momento?"selected":""}>${x}</option>`).join("")}</select></label>
      <label class="f">Tipo de registro<select id="rTipo">${Object.entries(TIPOS).map(([k,l])=>`<option value="${k}" ${k===e.tipo?"selected":""}>${l}</option>`).join("")}</select></label>
    </div>
    <div class="f" style="font-weight:700;font-size:.85rem">Niños y niñas observados
      ${st.ninos.length? `<div class="chips" id="rNinos">${ninosOrden().map(n=>`<button type="button" class="chip" data-act="chipNino" data-id="${n.id}" aria-pressed="${e.ninos.includes(n.id)}">${esc(n.nombre.split(" ").slice(0,2).join(" "))}</button>`).join("")}<button type="button" class="chip" data-act="chipTodos">Todo el grupo</button></div>` : `<span class="small muted" style="font-weight:400">Agrega niños en la pestaña Niños para etiquetarlos.</span>`}
    </div>
    <label class="f">¿Qué observaste? <span class="h">Describe los hechos: qué hizo, qué dijo (entre comillas), con quién, cómo</span><textarea id="rHecho" placeholder="Ej. En el sector de construcción, Mateo agrupó los bloques por color y dijo: “estos rojos son más”. Contó hasta 7 señalando cada bloque.">${esc(e.hecho)}</textarea></label>
    <div class="row">${micBtn("rHecho")}<button type="button" class="btn sm sun" data-act="iaObjetivo">${ico("spark")}Redactar de forma objetiva</button><button type="button" class="btn sm sun" data-act="iaComp">${ico("spark")}Sugerir competencia</button></div>
    <div class="ai-out" id="outReg" hidden></div>
    <div class="row" id="usarBox" hidden><button type="button" class="btn sm primary" data-act="usarTexto">Usar este texto</button><button type="button" class="btn sm ghost" data-act="descartar">Descartar</button></div>
    <div class="grid2">
      <label class="f">Área<select id="rArea"><option value="">Sin área</option>${Object.keys(AREAS).map(a=>`<option ${a===e.area?"selected":""}>${esc(a)}</option>`).join("")}</select></label>
      <label class="f">Nivel de logro (opcional)<select id="rNivel"><option value="">Sin calificar</option>${Object.entries(NIVELES).map(([k,l])=>`<option value="${k}" ${k===e.nivel?"selected":""}>${k} · ${l}</option>`).join("")}</select></label>
    </div>
    <label class="f">Competencia<select id="rComp"><option value="">${e.area?"Elige una competencia":"Elige primero un área"}</option>${comps.map(c=>`<option ${c===e.comp?"selected":""}>${esc(c)}</option>`).join("")}</select></label>
    <label class="f">Interpretación <span class="h">¿Qué evidencia esto sobre su aprendizaje?</span><textarea id="rInt" style="min-height:72px">${esc(e.interpretacion||"")}</textarea></label>
    <div class="row">${micBtn("rInt")}</div>
    <label class="f">Acciones o retroalimentación<textarea id="rAcc" style="min-height:64px" placeholder="Ej. Proponer juegos de comparación de cantidades; comentar a la familia.">${esc(e.acciones||"")}</textarea></label>
    <div class="f" style="font-weight:700;font-size:.85rem">Fotos de evidencia
      <div class="photo-grid" id="rFotos">${e.fotos.map((f,i)=>`<div class="photo"><img src="${esc(fotoSrc(f))}" alt="Evidencia ${i+1}"><button type="button" data-act="quitarFoto" data-i="${i}" aria-label="Quitar foto">✕</button></div>`).join("")}</div>
      <div class="row"><label class="btn">${ico("cam")}Tomar o subir fotos<input type="file" id="rFile" accept="image/*" capture="environment" multiple hidden></label>
      ${caps.sampleImg && e.fotos.length? `<button type="button" class="btn sm sun" data-act="iaFoto">${ico("spark")}Describir la foto</button>`:""}<span class="small muted" id="fotoEstado"></span></div>
    </div>
    ${e.nuevo? "" : `<div class="row" id="delRegBox" style="justify-content:flex-end"><button type="button" class="btn danger" data-act="delRegAsk">Eliminar registro</button></div>`}

}
function cerrarSheet(){ if(dictOn) caps.dict?.stop().catch(()=>{}); editing=null; $("#sheetRoot").innerHTML=""; render(); }
let iaPendiente = "";

/* ---------- Eventos ---------- */
document.addEventListener("click", async ev => {
  const b = ev.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act;
  if(a==="cerrarBg"){ if(ev.target===b) cerrarSheet(); return; }
  switch(a){
    case "tab": ui.tab=b.dataset.tab; ui.nino=null; render(); scrollTo(0,0); break;
    case "nuevoReg": nuevoReg(b.dataset.nino); break;
    case "openReg": abrirReg(b.dataset.id); break;
    case "cerrar": cerrarSheet(); break;
    case "chipNino": { syncForm(); const id=b.dataset.id, i=editing.ninos.indexOf(id); i<0?editing.ninos.push(id):editing.ninos.splice(i,1); b.setAttribute("aria-pressed", i<0); break; }
    case "chipTodos": { syncForm(); const all = editing.ninos.length===st.ninos.length; editing.ninos = all?[]:st.ninos.map(n=>n.id); document.querySelectorAll('#rNinos [data-act="chipNino"]').forEach(c=>c.setAttribute("aria-pressed", !all)); break; }
    case "quitarFoto": syncForm(); editing.fotos.splice(+b.dataset.i,1); abrirSheet(); break;
    case "guardarReg": {
      syncForm();
      if(!editing.hecho.trim() && !editing.fotos.length){ toast("Escribe qué observaste o agrega una foto."); return; }
      const r = {...editing}; delete r.nuevo; r.actualizado = Date.now();
      saveRegistro(r); toast("Registro guardado"); cerrarSheet(); break;
    }
    case "delRegAsk": $("#delRegBox").innerHTML = `<span class="small">¿Eliminar este registro? No se puede deshacer.</span><button type="button" class="btn sm ghost" data-act="delRegNo">No</button><button type="button" class="btn sm danger" data-act="delRegSi">Sí, eliminar</button>`; break;
    case "delRegNo": $("#delRegBox").innerHTML = `<button type="button" class="btn danger" data-act="delRegAsk">Eliminar registro</button>`; break;
    case "delRegSi": delRegistro(editing.id); toast("Registro eliminado"); cerrarSheet(); break;
    case "mic": toggleMic(b.dataset.target); break;
    case "iaObjetivo": {
      syncForm(); if(!editing.hecho.trim()){ toast("Primero escribe o dicta tus notas."); return; }
      const out = $("#outReg"); out.hidden=false; $("#usarBox").hidden=true;
      const nombres = editing.ninos.map(ninoNom).join(", ");
      const t = await ia(`Convierte estas notas en un registro de cuaderno de campo (observación) bien redactado. Reglas: describe solo hechos observables, en tercera persona y pasado; usa los nombres; cita entre comillas lo que dijeron los niños si aparece; sin juicios de valor ni diagnósticos (evita palabras como "flojo", "hiperactivo", "malcriado"); máximo 6 oraciones; no inventes datos. Devuelve solo el texto final.\n\nMomento: ${editing.momento}\nNiños: ${nombres||"no indicado"}\nNotas: ${editing.hecho}`, out);
      if(t){ iaPendiente = {campo:"rHecho", texto:t}; $("#usarBox").hidden=false; }
      break;
    }
    case "iaComp": {
      syncForm(); if(!editing.hecho.trim()){ toast("Primero describe la observación."); return; }
      const out = $("#outReg"); out.hidden=false; $("#usarBox").hidden=true;
      if(!caps.sample){ out.textContent="El asistente de IA no está disponible en esta vista."; return; }
      out.classList.add("loading"); out.textContent="Analizando…";
      try{
        const lista = Object.entries(AREAS).map(([ar,cs])=>`${ar}: ${cs.join(" | ")}`).join("\n");
        const r = await caps.sample.json(`${CONTEXTO}\n\nSegún esta observación de educación inicial, elige el área y la competencia del CNEB que mejor evidencia, y redacta una interpretación breve (2 oraciones) de lo que muestra sobre su aprendizaje, sin calificar. Responde SOLO JSON: {"area": "...", "competencia": "...", "interpretacion": "..."} usando textos EXACTOS de esta lista:\n${lista}\n\nObservación: ${editing.hecho}`);
        out.classList.remove("loading");
        if(r && AREAS[r.area]){ out.textContent = `Área: ${r.area}\nCompetencia: ${r.competencia}\n\n${r.interpretacion||""}`; iaPendiente = {comp:r}; $("#usarBox").hidden=false; }
        else out.textContent = "No encontré una competencia clara. Elígela manualmente.";
      }catch(e){ out.classList.remove("loading"); out.textContent = e?.code==="not_granted" ? "No diste permiso para usar el asistente." : "No se pudo analizar. Inténtalo de nuevo."; }
      break;
    }
    case "iaFoto": {
      syncForm(); const out = $("#outReg"); out.hidden=false; $("#usarBox").hidden=true;
      try{
        const blob = await (await fetch(fotoSrc(editing.fotos[0]))).blob();
        const t = await ia(`Describe de forma objetiva lo que se observa en esta foto de evidencia de un aula de inicial: qué están haciendo los niños, con qué materiales y cómo. 3 a 4 oraciones, sin juicios de valor, sin suponer nombres ni datos que no se ven. Devuelve solo el texto.${editing.hecho?"\nContexto de la docente: "+editing.hecho:""}`, out, {images:[blob]});
        if(t){ iaPendiente = {campo:"rHecho", texto:(editing.hecho? editing.hecho.trim()+"\n\n":"")+t}; $("#usarBox").hidden=false; }
      }catch{ out.textContent="No se pudo leer la foto."; }
      break;
    }
    case "usarTexto": {
      if(iaPendiente.campo){ $("#"+iaPendiente.campo).value = iaPendiente.texto; }
      else if(iaPendiente.comp){ const c=iaPendiente.comp; syncForm(); editing.area=c.area; editing.comp=AREAS[c.area].includes(c.competencia)?c.competencia:""; if(!editing.interpretacion.trim()) editing.interpretacion=c.interpretacion||""; abrirSheet(); return; }
      $("#outReg").hidden=true; $("#usarBox").hidden=true; break;
    }
    case "descartar": $("#outReg").hidden=true; $("#usarBox").hidden=true; break;
    case "ficha": ui.nino=b.dataset.id; render(); scrollTo(0,0); break;
    case "volverNinos": ui.nino=null; render(); break;
    case "delNinoAsk": $("#delNinoBox").innerHTML = `<span class="small">¿Quitar de la lista? Sus registros se conservan.</span> <button type="button" class="btn sm ghost" data-act="delNinoNo">No</button><button type="button" class="btn sm danger" data-act="delNinoSi">Sí, quitar</button>`; break;
    case "delNinoNo": render(); break;
    case "delNinoSi": st.ninos = st.ninos.filter(n=>n.id!==ui.nino); saveNinos(); ui.nino=null; toast("Quitado de la lista"); render(); break;
    case "conclusion": {
      const id=b.dataset.id, n=st.ninos.find(x=>x.id===id), area=$("#cdArea").value.replace(/ \(\d+\)$/,""), desde=$("#cdDesde").value||"0000";
      const R = regs().filter(r=>r.ninos?.includes(id) && r.fecha>=desde && (!r.area || r.area===area)).reverse();
      const out=$("#outCd"); out.hidden=false;
      if(!R.length){ out.textContent="No hay registros de esta área en el periodo elegido."; return; }
      const ev = R.map(r=>`- ${r.fecha} (${r.momento||""}${r.comp?"; "+r.comp:""}${r.nivel?"; nivel "+r.nivel:""}): ${r.hecho}${r.interpretacion?" Interpretación: "+r.interpretacion:""}`).join("\n");
      ia(`Redacta la conclusión descriptiva del área "${area}" para el informe de progreso de ${n.nombre}${n.nac?" ("+edadDe(n.nac)+")":""}. Basate SOLO en estas evidencias. Estructura en un párrafo de 4 a 6 oraciones: lo que logra (con ejemplos concretos), lo que está en proceso, y una recomendación práctica para la familia. Lenguaje positivo y comprensible para las familias. Al final, en una línea aparte, sugiere el nivel de logro (AD, A, B o C) con una breve justificación, marcada como "Sugerencia para la docente".\n\nEvidencias:\n${ev}`, out);
      break;
    }
    case "copiarOut": { const o=$("#"+b.dataset.out); if(o && !o.hidden && o.textContent) copiar(o.textContent,b); else toast("Primero genera un texto."); break; }
    case "resumenSem": {
      const t=hoy(), R=regs().filter(r=>diasEntre(r.fecha,t)<7 && diasEntre(r.fecha,t)>=0).reverse(), out=$("#outSem"); out.hidden=false;
      ia(`Resume la semana a partir de estos registros del cuaderno de campo. Incluye: 1) logros destacados del grupo, 2) niños o niñas que requieren más acompañamiento y en qué, 3) áreas con pocas evidencias, 4) tres sugerencias para la próxima semana. Usa viñetas cortas.\n\n${R.map(r=>`- ${r.fecha} ${r.momento||""} [${(r.ninos||[]).map(ninoNom).join(", ")||"grupo"}] ${r.area||""}: ${r.hecho}`).join("\n")}`, out);
      break;
    }
    case "redactar": {
      const tipo=$("#plTipo").value, notas=$("#plNotas").value.trim(), out=$("#outPl"); out.hidden=false;
      if(!notas){ out.textContent="Escribe o dicta tus notas primero."; return; }
      const p=st.perfil;
      ia(`${PLANTILLAS[tipo]}\nDatos de la docente: ${p.nombre||"[Nombre de la docente]"}, ${p.ie||"[Institución educativa]"}, ${p.aula||""}, ${p.ugel?"UGEL "+p.ugel:""}. Fecha de hoy: ${fmtLargo(hoy())}. Donde falte un dato, deja un espacio entre corchetes para completarlo; no lo inventes.\n\nNotas de la docente:\n${notas}`, out);
      break;
    }
    case "marca": {
      const f=ui.fechaAsis, mes=f.slice(0,7); st.asis[mes] ??= {}; st.asis[mes][f] ??= {};
      const d = st.asis[mes][f]; if(d[b.dataset.id]===b.dataset.k) delete d[b.dataset.id]; else d[b.dataset.id]=b.dataset.k;
      saveAsis(mes); render(); break;
    }
    case "todosP": { const f=ui.fechaAsis, mes=f.slice(0,7); st.asis[mes] ??= {}; const d = st.asis[mes][f] ??= {}; st.ninos.forEach(n=>{ if(!d[n.id]) d[n.id]="P"; }); saveAsis(mes); render(); break; }
    case "mes": { const [y,m]=ui.mes.split("-").map(Number), d=new Date(y,m-1+Number(b.dataset.d),1); ui.mes=isoOf(d).slice(0,7); render(); break; }
    case "mesHoy": ui.mes=hoy().slice(0,7); ui.diaSel=hoy(); render(); break;
    case "dia": ui.diaSel=b.dataset.d; if(ui.diaSel.slice(0,7)!==ui.mes) ui.mes=ui.diaSel.slice(0,7); render(); break;
    case "delEv": st.agenda = st.agenda.filter(e=>e.id!==b.dataset.id); saveAgenda(); render(); break;
    case "ejemplo": cargarEjemplo(); break;
    case "expAsis": exportarAsis(); break;
    case "backup": descargar(`cuaderno-respaldo-${hoy()}.json`, JSON.stringify(st,null,1)); break;
    case "portafolio": portafolio(b.dataset.id); break;
  }
});
document.addEventListener("input", ev => {
  const id = ev.target.id;
  if(id==="fq"){ ui.f.q=ev.target.value; clearTimeout(window._fq); window._fq=setTimeout(()=>{ const pos=ev.target.selectionStart; render(); const el=$("#fq"); el.focus(); el.setSelectionRange(pos,pos); },250); }
});
document.addEventListener("change", async ev => {
  const t = ev.target, id = t.id;
  if(id==="fnino"){ ui.f.nino=t.value; render(); }
  else if(id==="farea"){ ui.f.area=t.value; render(); }
  else if(id==="ftipo"){ ui.f.tipo=t.value; render(); }
  else if(id==="rArea"){ syncForm(); editing.comp=""; abrirSheet(); }
  else if(id==="asisFecha" && t.value){ ui.fechaAsis=t.value; render(); }
  else if(id==="rFile" && t.files.length){
    syncForm(); $("#fotoEstado").textContent = "Guardando fotos…";
    const nuevas = await subirFotos([...t.files]); if(!editing) return;
    editing.fotos.push(...nuevas); abrirSheet();
  }
  else if(id==="impFile" && t.files[0]){
    try{ const j = JSON.parse(await t.files[0].text()); if(!Array.isArray(j.ninos) || typeof j.registros!=="object") throw 0;
      st.perfil=j.perfil||{}; st.ninos=j.ninos; st.agenda=j.agenda||[]; st.asis=j.asis||{};
      savePerfil(); saveNinos(); saveAgenda(); Object.keys(st.asis).forEach(saveAsis);
      st.registros={}; Object.values(j.registros).forEach(saveRegistro); toast("Respaldo restaurado"); render();
    }catch{ toast("Ese archivo no es un respaldo válido del cuaderno."); }
  }
});
document.addEventListener("submit", ev => {
  ev.preventDefault(); const f = ev.target;
  if(f.id==="formNino"){ const nom=$("#nNom").value.trim(); if(!nom) return; st.ninos.push({id:uidGen(), nombre:nom, nac:$("#nNac").value, apo:$("#nApo").value.trim(), tel:$("#nTel").value.trim(), notas:$("#nNot").value.trim()}); saveNinos(); toast(`${nom} agregado`); render(); $("#nNom").focus(); }
  else if(f.id==="formEditNino"){ const n=st.ninos.find(x=>x.id===f.dataset.id); Object.assign(n,{nombre:$("#eNom").value.trim()||n.nombre, nac:$("#eNac").value, apo:$("#eApo").value.trim(), tel:$("#eTel").value.trim(), notas:$("#eNot").value.trim()}); saveNinos(); toast("Datos guardados"); render(); }
  else if(f.id==="formEv"){ const tit=$("#evTit").value.trim(); if(!tit) return; st.agenda.push({id:uidGen(), fecha:ui.diaSel, hora:$("#evHora").value, titulo:tit, tipo:$("#evTipo").value, nota:$("#evNota").value.trim()}); saveAgenda(); toast("Actividad agregada"); render(); }
  else if(f.id==="formPerfil"){ st.perfil={nombre:$("#pNom").value.trim(), ie:$("#pIe").value.trim(), aula:$("#pAula").value.trim(), ugel:$("#pUgel").value.trim()}; savePerfil(); toast("Perfil guardado"); render(); }
});
document.addEventListener("keydown", e => { if(e.key==="Escape" && editing) cerrarSheet(); });

/* ---------- Exportar ---------- */
async function descargar(nombre, data){
  if(!caps.dl){ toast("La descarga no está disponible en esta vista."); return; }
  try{ await caps.dl.save({filename:nombre, data}); toast("Archivo listo"); }
  catch(e){ if(e?.code!=="declined") toast("No se pudo descargar el archivo."); }
}
function exportarAsis(){
  const mes = $("#expMes").value || hoy().slice(0,7), dias = st.asis[mes] || {};
  const fechas = Object.keys(dias).sort();
  if(!fechas.length){ toast("No hay asistencia registrada en ese mes."); return; }
  const q = s => `"${String(s).replace(/"/g,'""')}"`;
  const filas = [["N.°","Nombre",...fechas.map(f=>parseISO(f).getDate()),"P","T","F","J"].map(q).join(";")];
  ninosOrden().forEach((n,i)=>{ const v=fechas.map(f=>dias[f][n.id]||""); const c=k=>v.filter(x=>x===k).length; filas.push([i+1,n.nombre,...v,c("P"),c("T"),c("F"),c("J")].map(q).join(";")); });
  descargar(`asistencia-${mes}.csv`, "﻿"+filas.join("\r\n"));
}
async function portafolio(id){
  const n = st.ninos.find(x=>x.id===id), R = regs().filter(r=>r.ninos?.includes(id)).reverse(), p = st.perfil;
  toast("Preparando portafolio…");
  const fotoData = async f => { if(f.src) return f.src; try{ return await blobToDataURL(await (await fetch("/_blob/"+f.id)).blob()); }catch{ return ""; } };
  let cuerpo = "";
  for(const r of R){
    const imgs = (await Promise.all((r.fotos||[]).map(fotoData))).filter(Boolean).map(s=>`<img src="${s}">`).join("");
    cuerpo += `<article><h3>${esc(fmtLargo(r.fecha))} · ${esc(r.momento||"")}</h3><p class="m">${esc(TIPOS[r.tipo]||"")}${r.area?" · "+esc(r.area):""}${r.comp?" · "+esc(r.comp):""}${r.nivel?" · Nivel "+r.nivel:""}</p><p>${esc(r.hecho)}</p>${r.interpretacion?`<p><b>Interpretación:</b> ${esc(r.interpretacion)}</p>`:""}${r.acciones?`<p><b>Acciones:</b> ${esc(r.acciones)}</p>`:""}<div class="g">${imgs}</div></article>`;
  }
  const a = asisNino(id);
  const html = `<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Portafolio de ${esc(n.nombre)}</title><style>body{font-family:system-ui,sans-serif;max-width:800px;margin:24px auto;padding:0 16px;color:#1E2B3A;line-height:1.5}h1{margin-bottom:0}article{border-top:1px solid #ccc;padding:12px 0;break-inside:avoid}.m{color:#5B6B78;font-size:.9em}.g{display:flex;flex-wrap:wrap;gap:8px}.g img{width:220px;border-radius:8px}</style></head><body><h1>Portafolio de evidencias</h1><h2>${esc(n.nombre)}</h2><p>${esc(p.ie||"")} ${p.aula?"· "+esc(p.aula):""} ${p.nombre?"· Docente: "+esc(p.nombre):""}<br>Asistencia: ${a.pct===null?"sin datos":a.pct+"% ("+a.F+" faltas, "+a.T+" tardanzas)"} · Generado el ${esc(fmtLargo(hoy()))}</p>${cuerpo||"<p>Sin registros.</p>"}</body></html>`;
  descargar(`portafolio-${n.nombre.split(" ").slice(0,2).join("-").toLowerCase()}.html`, html);
}
